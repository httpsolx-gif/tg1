[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-mailer"
version = "0.1.0"
description = "Telegram mailer bot + FastAPI tracker/logs API"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.7,<4",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2.0.35,<3",
  "sqlmodel>=0.0.21",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "aiosmtplib>=3,<4",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<0.28",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.31",
  "orjson>=3.10,<4",
  "python-json-logger>=2.0,<3",
  "cryptography>=43,<44",
  "aiohttp>=3.9,<4",
  "asyncssh>=2.14,<2.18",
  "boto3>=1.34,<2",
]

[tool.uvicorn]
host = "0.0.0.0"
port = 8080
log-level = "info"
reload = true


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "api*", "common*"]
exclude = ["tests*", "docker*", "logs*", "templates*", "migrations*", "scripts*"]

[tool.setuptools.package-data]
bot = ["**/*.j2"]
