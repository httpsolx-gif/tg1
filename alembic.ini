[alembic]
script_location = migrations
timezone = UTC
prepend_sys_path = .

# (опционально) если хочешь жёстко задать URL тут, можно раскомментировать:
# sqlalchemy.url = postgresql+psycopg://mailer:mailer@localhost:5432/mailer

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s