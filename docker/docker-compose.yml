version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mailer
      POSTGRES_PASSWORD: mailer
      POSTGRES_DB: mailer
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    env_file: ../.env
    depends_on: [db]
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file: ../.env
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  dbdata:
